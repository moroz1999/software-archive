# Test settings, read on top of the application's own (docs/testing.md).
# The database of the PostgreSQL of the test JVM (TestcontainersConfiguration).
test.database=test
# A test class that commits leaves the database as the migrations made it (ResetDatabaseAfterCommittingTests).
spring.flyway.clean-disabled=false
# The search worker does not run on a schedule: a test drives it. Set here, not by a test configuration, since the
# schedule is decided before such a configuration adds its properties.
search.worker.enabled=false
