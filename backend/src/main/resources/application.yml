spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  servlet:
    multipart:
      # Above the business limit, so the archive itself says which file is too large.
      max-file-size: 101MB
      max-request-size: 102MB
      # Every uploaded file goes to a temporary file at once and is streamed from there, never held in memory.
      file-size-threshold: 0
  mail:
    # Mailpit of docker-compose catches every letter: http://localhost:8025
    host: localhost
    port: 1025
  flyway:
    enabled: true
    # Fixtures are repeatable migrations applied only with the "fixtures" profile;
    # a database seeded with them must still start without it.
    ignore-migration-patterns: "*:future,repeatable:missing"

screenshots:
  # Business data like the database: kept outside the build, backed up with it.
  storage-path: ../upload/images

release-archives:
  # Kept beside the screenshots in upload, in a folder of their own, under internal UUIDs.
  storage-path: ../upload/releases

search:
  typesense:
    url: http://localhost:8108
    api-key: my-secret-key
    timeout: 2s
  worker:
    delay: 1s

auth:
  # Local development only; production sets its own secret of at least 32 bytes.
  jwt-secret: local-development-secret-of-32-bytes-at-least
  access-lifetime: 15m
  public-url: http://localhost:5173
  mail-from: no-reply@localhost
  secure-cookies: true
