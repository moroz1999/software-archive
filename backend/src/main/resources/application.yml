spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    # Fixtures are repeatable migrations applied only with the "fixtures" profile;
    # a database seeded with them must still start without it.
    ignore-migration-patterns: "*:future,repeatable:missing"

search:
  typesense:
    url: http://localhost:8108
    api-key: my-secret-key
    timeout: 2s
  worker:
    delay: 1s
